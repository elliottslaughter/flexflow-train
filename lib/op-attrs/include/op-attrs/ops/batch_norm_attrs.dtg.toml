namespace = "FlexFlow"
name = "BatchNormAttrs"
type = "struct"

features = [
  "eq",
  "ord",
  "hash",
  "json",
  "rapidcheck",
  "fmt",
]

includes = [
  "<optional>",
  "op-attrs/activation.dtg.h",
  "op-attrs/ops/batch_norm_mode.dtg.h",
]

src_includes = [
  "utils/fmt/optional.h",
  "utils/json/optional.h",
  "utils/rapidcheck/optional.h",
]

[[fields]]
name = "activation"
type = "std::optional<::FlexFlow::Activation>"
docstring = '''
\brief An elementwise activation applied to this operator's output, computed by the same kernel rather than by a separate operator.

Either written by the model author, or introduced by \ref operation_fusion.h, which folds an adjacent elementwise operator into its neighbor so that the value between them is never materialized.
'''

[[fields]]
name = "affine"
type = "bool"

[[fields]]
name = "eps"
type = "float"

[[fields]]
name = "momentum"
type = "std::optional<float>"

[[fields]]
name = "mode"
type = "::FlexFlow::BatchNormMode"
