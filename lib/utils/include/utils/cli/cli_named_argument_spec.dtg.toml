namespace = "FlexFlow"
name = "CLINamedArgumentSpec"
type = "struct"
features = [
  "eq",
  "ord",
  "hash",
  "fmt",
  "json",
]

includes = [
  "<optional>",
  "<set>",
  "<string>",
]

src_includes = [
  "utils/fmt/optional.h",
  "utils/fmt/vector.h",
  "utils/hash/vector.h",
  "utils/json/optional.h",
]

[[fields]]
name = "long_flag"
type = "std::string"

[[fields]]
name = "metavar"
type = "std::string"

[[fields]]
name = "choices"
type = "std::optional<std::vector<std::string>>"

[[fields]]
name = "description"
type = "std::optional<std::string>"
